name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: API tests on PostgreSQL (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=api.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: TestResults

  web:
    name: Web build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test -w web

  e2e:
    name: Two-browser tests (Playwright, real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: true
      LASTSEAT_E2E_DB: Host=localhost;Port=5432;Database=lastseat_e2e;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: dotnet build src/LastSeat.Api
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Hold and confirm through the published port
        run: |
          set -euo pipefail
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/ | grep -q '<app-root>'
          session=$(curl -fsS -X POST localhost:8080/api/sessions -H 'content-type: application/json' -d '{"name":"CI"}' | jq -r .id)
          hold=$(curl -fsS -X POST localhost:8080/api/performances/1/holds \
            -H 'content-type: application/json' -H "X-Session-Id: $session" -H 'Idempotency-Key: ci-1' \
            -d '{"seatIds":[1077,1078]}' | jq -r .holdId)
          curl -fsS -X POST "localhost:8080/api/holds/$hold/confirm" -H "X-Session-Id: $session" -H 'Idempotency-Key: ci-2' | jq .

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --volumes
